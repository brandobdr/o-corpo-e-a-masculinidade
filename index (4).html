osterona`,text:`A testosterona molda humor, energia e libido — mas o efeito varia muito de homem para homem.`,pos:{left:`50%`,top:`6%`},tone:`indigo`},laringe:{num:2,title:`Laringe e voz`,text:`Na puberdade, a laringe cresce e engrossa a voz, formando o pomo de adão.`,pos:{left:`50%`,top:`15.5%`},tone:`indigo`},ombros:{num:3,title:`Ombros e postura`,text:`A testosterona favorece ombros mais largos e mais massa muscular na parte superior do corpo.`,pos:{left:`68%`,top:`19%`},tone:`teal`},peitoral:{num:4,title:`Peitoral`,text:`Os músculos peitorais sustentam os ombros e ganham volume com treino de força regular.`,pos:{left:`50%`,top:`23.5%`},tone:`teal`},coracao:{num:5,title:`Coração`,text:`Corações masculinos bombeiam mais sangue por batida, mas o risco cardíaco também aparece mais cedo.`,pos:{left:`41%`,top:`25%`},tone:`rose`},biceps:{num:6,title:`Braços e força`,text:`Volume muscular depende de testosterona, treino e alimentação — não só de genética.`,pos:{left:`77%`,top:`25.5%`},tone:`warm`},antebraco:{num:7,title:`Antebraços`,text:`Antebraços fortes sustentam a preensão manual e são ativados em quase todo exercício de braço.`,pos:{left:`20%`,top:`32.5%`},tone:`warm`},pele:{num:8,title:`Pele e pelos`,text:`Pelos faciais e corporais surgem na puberdade pela ação da testosterona na pele.`,pos:{left:`79%`,top:`34.5%`},tone:`violet`},abdomen:{num:9,title:`Abdômen`,text:`Hormônios influenciam a gordura abdominal, favorecendo o acúmulo em formato de 'maçã'.`,pos:{left:`50%`,top:`33%`},tone:`teal`},obliquos:{num:10,title:`Oblíquos`,text:`Os oblíquos estabilizam o tronco e permitem os movimentos de rotação e flexão lateral.`,pos:{left:`61%`,top:`33.5%`},tone:`teal`},reprodutivo:{num:11,title:`Sistema reprodutivo`,text:`Os testículos produzem espermatozoides continuamente e são a principal fonte de testosterona.`,pos:{left:`50%`,top:`43.5%`},tone:`violet`},quadriceps:{num:12,title:`Quadríceps`,text:`O quadríceps é um dos maiores grupos musculares do corpo e sustenta grande
